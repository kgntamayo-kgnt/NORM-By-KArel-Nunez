      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = '';
          const iconEl = document.createElement('i');
          iconEl.setAttribute('data-lucide', name);
          iconEl.className = className;
          spanRef.current.appendChild(iconEl);
          window.lucide.createIcons({ root: spanRef.current });
        }
      }, [name, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    const GLOSSARY_TERMS = [
      { term: 'NORM', def: 'Materiales Radiactivos de Origen Natural (Naturally Occurring Radioactive Material). Materiales presentes en la naturaleza cuyos radionucleidos (²³⁸U, ²³²Th, ⁴⁰K) pueden concentrarse por procesos industriales como la extracción de petróleo y gas.' },
      { term: 'Fondo Natural (Natural Background)', def: 'Dosis, tasas de dosis o concentraciones de actividad asociadas a fuentes naturales existentes en el ambiente (cósmica y terrestre) que no son susceptibles de control. En Colombia oscila típicamente entre 0.05 y 0.20 µSv/h.' },
      { term: 'Principio ALARA', def: 'Acrónimo de "As Low As Reasonably Achievable" (Tan bajo como sea razonablemente alcanzable). Exige optimizar la protección radiológica considerando factores económicos y sociales.' },
      { term: 'Enfoque Graduado (Graded Approach)', def: 'Principio del OIEA (GSR Part 3 / SSG-60) según el cual el rigor del control regulatorio y de vigilancia debe ser proporcional a la magnitud y probabilidad de las exposiciones radiológicas.' },
      { term: 'Radiobarita', def: 'Sulfato de bario y radio [Ba(Ra)SO₄] que precipita formando incrustaciones extremadamente duras en el interior de tuberías y equipos al caer la presión y temperatura del agua de formación.' },

      { term: 'Tasa de Dosis Efectiva', def: 'Magnitud física que mide la intensidad del campo de radiación recibida por unidad de tiempo. Se expresa en microsieverts por hora (µSv/h) o milisieverts por hora (mSv/h).' }

    // ============================================================================
    // COMPONENTE PRINCIPAL DE LA APLICACIÓN
    // ============================================================================

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [glossaryOpen, setGlossaryOpen] = useState(false);
      const [glossarySearch, setGlossarySearch] = useState('');
      const [toastMessage, setToastMessage] = useState(null);

      // Calculadora de Niveles de Referencia
      const [backgroundReadings, setBackgroundReadings] = useState([0.11, 0.12, 0.10, 0.11]);
      const [pointReading, setPointReading] = useState(0.45);
      const [exposureHours, setExposureHours] = useState(200);
      const [radonLevel, setRadonLevel] = useState(180);

      // Mapa de Procesos NORM
      const [selectedNodeId, setSelectedNodeId] = useState('wellhead');

      // Árboles de Decisión Operativos
      const [treeMode, setTreeMode] = useState('equipment');
      const [equipStep, setEquipStep] = useState('start');
      const [remStep, setRemStep] = useState('start');

      // Selector de Instrumentación y EPP
      const [selectedScenario, setSelectedScenario] = useState('routine_gamma');

      // Registros Digitales de Campo (Anexos 1, 2 y 3)
      const [activeForm, setActiveForm] = useState('anexo1');
      const [anexo1Rows, setAnexo1Rows] = useState([
        { id: 1, point: 'Perímetro Norte - Zona Libre', m1: 0.11, m2: 0.12, m3: 0.10, m4: 0.11, obs: 'Sin presencia de equipos ni lodos' },
        { id: 2, point: 'Acceso Vía Principal - Punto Control', m1: 0.13, m2: 0.12, m3: 0.14, m4: 0.13, obs: 'Suelo natural arcilloso' }
      ]);
      const [anexo2Rows, setAnexo2Rows] = useState([
        { id: 1, code: 'PI-01', desc: 'Cabezal de Pozo Productor', measured: 0.18, obs: 'Operación normal' },
        { id: 2, code: 'PI-02', desc: 'Separador Trifásico V-101 (Fondo)', measured: 0.65, obs: 'Posible acumulación de lodos' },
        { id: 3, code: 'PI-03', desc: 'Patio de Tubería Recuperada (Rack 4)', measured: 3.40, obs: 'Incrustación detectada en junta' },
        { id: 4, code: 'PI-04', desc: 'Piscina de Agua de Producción', measured: 0.15, obs: 'Nivel basal' }
      ]);
      const [anexo3Rows, setAnexo3Rows] = useState([
        { id: 1, worker: 'Ing. Carlos Méndez (OPR)', activity: 'Inspección radiométrica patio tuberías', hours: 3.5, dose: 4.2 },
        { id: 2, worker: 'Téc. Ana Gómez (Mantenimiento)', activity: 'Apertura y limpieza separador V-101', hours: 6.0, dose: 11.5 }
      ]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const avgBackground = useMemo(() => {
        const valid = backgroundReadings.map(Number).filter(n => !isNaN(n) && n >= 0);
        if (valid.length === 0) return 0.11;
        return valid.reduce((a, b) => a + b, 0) / valid.length;
      }, [backgroundReadings]);

      const netDoseRate = useMemo(() => Math.max(0, Number(pointReading) - avgBackground), [pointReading, avgBackground]);
      const ratioToBackground = useMemo(() => (avgBackground <= 0 ? 0 : Number(pointReading) / avgBackground), [pointReading, avgBackground]);
      const projectedAnnualDoseMsv = useMemo(() => (netDoseRate * Number(exposureHours)) / 1000, [netDoseRate, exposureHours]);

      const classification = useMemo(() => {
        if (netDoseRate > 10) {
          return {
            level: 'NIVEL DE ACTUACIÓN (> 10 µSv/h netos)',
            bg: 'bg-red-50 border-red-300 text-red-900',
            badge: 'bg-red-600 text-white',
            summary: 'Tasa de dosis neta crítica. Se requieren acciones protectoras y reparadoras inmediatas.',
            actions: [
              'Restringir inmediatamente el acceso al área o equipo y colocar señalización reglamentaria de radiación ionizante (trébol radiactivo).',
              'Notificar al Responsable de Vigilancia Radiológica (RVR) para evaluación dosimétrica detallada y plan de intervención.',
              'Implementar controles estrictos de tiempo, distancia y blindaje; uso obligatorio de dosimetría personal de lectura directa (EPD).',
              'Evaluar descontaminación de equipamiento (Cap. 4.1) o remediación/aislamiento del área (Cap. 4.2).'
            ]
          };
        }
        if (netDoseRate > 2.5) {
          return {
            level: 'NIVEL DE INTERVENCIÓN OPERACIONAL (> 2.5 µSv/h netos)',
            bg: 'bg-amber-50 border-amber-300 text-amber-900',
            badge: 'bg-amber-500 text-white',
            summary: 'Supera el umbral operacional. Deben aplicarse medidas protectoras y optimización ALARA.',
            actions: [
              'Demarcar y señalizar preventivamente la zona o tramo de tubería con presencia de NORM.',
              'Limitar el tiempo de permanencia de los trabajadores y aumentar la distancia de seguridad.',
              'Exigir EPP específico (guantes de nitrilo, protección respiratoria HEPA si hay riesgo de polvo/aerosoles) y dosimetría.',
              'Programar caracterización radiométrica en laboratorio (espectrometría gamma) para verificar criterios de exención/dispensa (1 Bq/g).'
            ]
          };
        }
        if (ratioToBackground > 3) {
          return {
            level: 'NIVEL DE INVESTIGACIÓN (> 3× Fondo Natural)',
            bg: 'bg-sky-50 border-sky-300 text-sky-900',
            badge: 'bg-sky-600 text-white',
            summary: 'Lectura superior a 3 veces el fondo natural local. Amerita investigación técnica.',
            actions: [
              'Reportar la anomalía al Responsable de Vigilancia Radiológica (RVR) para identificar la causa (ej. inicio de incrustaciones o acumulación de lodos).',
              'Incrementar la frecuencia de monitoreo en este punto de interés.',
              'Verificar calibración y vigencia del intensímetro utilizado.',
              'Registrar en el formato de seguimiento (Anexo 2) y evaluar si se proyectan tareas de mantenimiento invasivo.'
            ]
          };
        }
        return {
          level: 'CONDICIÓN NORMAL / FONDO NATURAL',
          bg: 'bg-emerald-50 border-emerald-300 text-emerald-900',
          badge: 'bg-emerald-600 text-white',
          summary: 'Valores dentro de la variabilidad natural esperada para el área de operación.',
          actions: [
            'Continuar con el programa de vigilancia radiológica rutinario según cronograma establecido.',
            'Mantener el registro histórico de línea base para trazabilidad ambiental y ocupacional.',
            'No se requieren restricciones radiológicas adicionales para operación normal.'
          ]
        };
      }, [netDoseRate, ratioToBackground]);

      const selectedNode = useMemo(
        () => FACILITY_NODES.find(n => n.id === selectedNodeId) || FACILITY_NODES[0],
        [selectedNodeId]
      );

      const filteredGlossary = useMemo(() => {
        const q = glossarySearch.toLowerCase().trim();
        if (!q) return GLOSSARY_TERMS;
        return GLOSSARY_TERMS.filter(
          item => item.term.toLowerCase().includes(q) || item.def.toLowerCase().includes(q)
        );
      }, [glossarySearch]);

      const exportToCSV = (filename, headers, rows) => {
        try {
          const csvContent =
            '\uFEFF' +
            [headers.join(','), ...rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))].join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', filename);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          showToast(`Archivo "${filename}" descargado correctamente.`);
        } catch (err) {
          showToast('Error al generar el archivo CSV.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* NOTIFICACIÓN FLOTANTE (SIN ALERT) */}

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between py-3.5 gap-3">
                <div className="flex items-center gap-3">
                  <div className="p-2.5 bg-amber-500/15 border border-amber-400/40 rounded-xl text-amber-400">
                    <LucideIcon name="radio" className="w-6 h-6" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <h1 className="text-lg sm:text-xl font-bold tracking-tight text-white">
                        NORM <span className="text-amber-400">Oil & Gas</span> Hub
                      </h1>
                      <span className="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                        Estándar Técnico Integral
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Vigilancia y Protección Radiológica en Hidrocarburos • Base MME / OIEA GSR Part 3 / SSG-60 / IOGP 412
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2 self-start md:self-auto">
                  <button
                    onClick={() => setGlossaryOpen(true)}
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors"
                  >
                    <LucideIcon name="book-open" className="w-3.5 h-3.5 text-amber-400" />
                    Glosario Técnico
                  </button>
                </div>
              </div>

              <nav className="flex overflow-x-auto no-scrollbar gap-1 pt-1 pb-0 border-t border-slate-800/80">
                {[

                          onClick={() =>
                            setAnexo1Rows([
                              ...anexo1Rows,
                              { id: Date.now(), point: 'Nuevo Punto Control', m1: 0.11, m2: 0.11, m3: 0.12, m4: 0.11, obs: '' }
                            ])
                          }
                          className="inline-flex items-center gap-1 px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-lg"
                        >
                          <LucideIcon name="plus" className="w-3.5 h-3.5" /> Agregar Punto
                        </button>
                        <button
                          onClick={() =>
                            exportToCSV(
                              'Anexo1_Fondo_Natural_NORM.csv',
                              ['Punto Seleccionado', 'M1 (µSv/h)', 'M2 (µSv/h)', 'M3 (µSv/h)', 'M4 (µSv/h)', 'Promedio (µSv/h)', 'Observaciones'],
                              anexo1Rows.map(r => [
                                r.point,
                                r.m1,
                                r.m2,
                                r.m3,
                                r.m4,
                                ((Number(r.m1) + Number(r.m2) + Number(r.m3) + Number(r.m4)) / 4).toFixed(3),
                                r.obs
                              ])
                            )
                          }
                          className="inline-flex items-center gap-1 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg"
                        >
                          <LucideIcon name="download" className="w-3.5 h-3.5" /> Exportar CSV
                        </button>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-100 text-slate-700 border-b border-slate-200">
                            <th className="p-2.5 font-bold">Punto Seleccionado</th>
                            <th className="p-2.5 font-bold w-24">Med. 1</th>
                            <th className="p-2.5 font-bold w-24">Med. 2</th>
                            <th className="p-2.5 font-bold w-24">Med. 3</th>
                            <th className="p-2.5 font-bold w-24">Med. 4</th>
                            <th className="p-2.5 font-bold">Promedio (µSv/h)</th>
                            <th className="p-2.5 font-bold">Observaciones</th>
                            <th className="p-2.5 w-10"></th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {anexo1Rows.map((row, idx) => {
                            const avg = (Number(row.m1) + Number(row.m2) + Number(row.m3) + Number(row.m4)) / 4;
                            return (
                              <tr key={row.id}>
                                <td className="p-2">
                                  <input
                                    type="text"
                                    value={row.point}
                                    onChange={e => {
                                      const copy = [...anexo1Rows];
                                      copy[idx].point = e.target.value;
                                      setAnexo1Rows(copy);
                                    }}
                                    className="w-full px-2 py-1 border border-slate-300 rounded"
                                  />
                                </td>
                                {['m1', 'm2', 'm3', 'm4'].map(field => (
                                  <td key={field} className="p-2">
                                    <input
                                      type="number"
                                      step="0.01"
                                      value={row[field]}
                                      onChange={e => {
                                        const copy = [...anexo1Rows];
                                        copy[idx][field] = parseFloat(e.target.value) || 0;
                                        setAnexo1Rows(copy);
                                      }}
                                      className="w-full px-2 py-1 font-mono border border-slate-300 rounded"
                                    />
                                  </td>
                                ))}
                                <td className="p-2 font-mono font-bold text-sky-800">{avg.toFixed(3)} µSv/h</td>
                                <td className="p-2">
                                  <input
                                    type="text"
                                    value={row.obs}
                                    onChange={e => {
                                      const copy = [...anexo1Rows];
                                      copy[idx].obs = e.target.value;
                                      setAnexo1Rows(copy);
                                    }}
                                    className="w-full px-2 py-1 border border-slate-300 rounded"
                                  />
                                </td>
                                <td className="p-2 text-center">
                                  <button
                                    onClick={() => setAnexo1Rows(anexo1Rows.filter(r => r.id !== row.id))}
                                    className="text-slate-400 hover:text-red-600"
                                    title="Eliminar fila"
                                  >
                                    <LucideIcon name="trash-2" className="w-4 h-4" />
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* ANEXO 2 */}
                {activeForm === 'anexo2' && (
                  <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <h3 className="text-sm font-bold text-slate-800">
                        Anexo 2 — Monitoreo Radiológico en Puntos de Interés (Fondo Aplicado: {avgBackground.toFixed(3)} µSv/h)
                      </h3>
                      <div className="flex gap-2">
                        <button
                          onClick={() =>
                            setAnexo2Rows([
                              ...anexo2Rows,
                              { id: Date.now(), code: `PI-0${anexo2Rows.length + 1}`, desc: 'Nuevo equipo o tramo', measured: 0.15, obs: '' }
                            ])
                          }
                          className="inline-flex items-center gap-1 px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-lg"
                        >
                          <LucideIcon name="plus" className="w-3.5 h-3.5" /> Agregar Punto
                        </button>
                        <button
                          onClick={() =>
                            exportToCSV(
                              'Anexo2_Puntos_Interes_NORM.csv',
                              ['Punto', 'Descripción', 'Tasa Medida (µSv/h)', 'Tasa Neta (µSv/h)', 'Estado Nivel Referencia', 'Observaciones'],
                              anexo2Rows.map(r => {
                                const net = Math.max(0, Number(r.measured) - avgBackground);
                                const status =
                                  net > 10 ? 'ACTUACION' : net > 2.5 ? 'INTERVENCION' : Number(r.measured) > avgBackground * 3 ? 'INVESTIGACION' : 'NORMAL';
                                return [r.code, r.desc, r.measured, net.toFixed(3), status, r.obs];
                              })
                            )
                          }
                          className="inline-flex items-center gap-1 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg"
                        >
                          <LucideIcon name="download" className="w-3.5 h-3.5" /> Exportar CSV
                        </button>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-100 text-slate-700 border-b border-slate-200">
                            <th className="p-2.5 font-bold w-24">Punto</th>
                            <th className="p-2.5 font-bold">Descripción del Equipo / Área</th>
                            <th className="p-2.5 font-bold w-32">Tasa Medida (µSv/h)</th>
                            <th className="p-2.5 font-bold w-32">Tasa Neta (µSv/h)</th>
                            <th className="p-2.5 font-bold">Clasificación</th>
                            <th className="p-2.5 font-bold">Observaciones</th>
                            <th className="p-2.5 w-10"></th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {anexo2Rows.map((row, idx) => {
                            const net = Math.max(0, Number(row.measured) - avgBackground);
                            let badge = <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">Normal</span>;
                            if (net > 10) badge = <span className="px-2 py-0.5 rounded bg-red-600 text-white font-bold">Actuación (&gt;10)</span>;
                            else if (net > 2.5) badge = <span className="px-2 py-0.5 rounded bg-amber-500 text-white font-bold">Intervención (&gt;2.5)</span>;
                            else if (Number(row.measured) > avgBackground * 3) badge = <span className="px-2 py-0.5 rounded bg-sky-600 text-white font-bold">Investigación (&gt;3×)</span>;

                            return (
                              <tr key={row.id}>
                                <td className="p-2">
                                  <input
                                    type="text"
                                    value={row.code}
                                    onChange={e => {
                                      const copy = [...anexo2Rows];
                                      copy[idx].code = e.target.value;
                                      setAnexo2Rows(copy);
                                    }}
                                    className="w-full px-2 py-1 font-mono border border-slate-300 rounded"
                                  />
                                </td>
                                <td className="p-2">
                                  <input
                                    type="text"
                                    value={row.desc}
                                    onChange={e => {
                                      const copy = [...anexo2Rows];
                                      copy[idx].desc = e.target.value;
                                      setAnexo2Rows(copy);
                                    }}
                                    className="w-full px-2 py-1 border border-slate-300 rounded"
                                  />
                                </td>
                                <td className="p-2">
                                  <input
                                    type="number"
                                    step="0.01"
                                    value={row.measured}
                                    onChange={e => {
                                      const copy = [...anexo2Rows];
                                      copy[idx].measured = parseFloat(e.target.value) || 0;
                                      setAnexo2Rows(copy);
                                    }}
                                    className="w-full px-2 py-1 font-mono border border-slate-300 rounded"
                                  />
                                </td>
                                <td className="p-2 font-mono font-bold text-slate-900">{net.toFixed(3)} µSv/h</td>
                                <td className="p-2">{badge}</td>
                                <td className="p-2">
                                  <input
                                    type="text"
                                    value={row.obs}
                                    onChange={e => {
                                      const copy = [...anexo2Rows];
                                      copy[idx].obs = e.target.value;
                                      setAnexo2Rows(copy);
                                    }}
                                    className="w-full px-2 py-1 border border-slate-300 rounded"
                                  />
                                </td>
                                <td className="p-2 text-center">
                                  <button
                                    onClick={() => setAnexo2Rows(anexo2Rows.filter(r => r.id !== row.id))}
                                    className="text-slate-400 hover:text-red-600"
                                    title="Eliminar fila"
                                  >
                                    <LucideIcon name="trash-2" className="w-4 h-4" />
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* ANEXO 3 */}
                {activeForm === 'anexo3' && (
                  <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <h3 className="text-sm font-bold text-slate-800">
                        Anexo 3 — Control Dosimétrico Operacional por Actividad
                      </h3>
                      <div className="flex gap-2">
                        <button
                          onClick={() =>
                            setAnexo3Rows([
                              ...anexo3Rows,
                              { id: Date.now(), worker: 'Operador / Técnico', activity: 'Actividad en zona supervisada', hours: 2.0, dose: 1.5 }
                            ])
                          }
                          className="inline-flex items-center gap-1 px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-lg"
                        >
                          <LucideIcon name="plus" className="w-3.5 h-3.5" /> Agregar Registro
                        </button>
                        <button
                          onClick={() =>
                            exportToCSV(
                              'Anexo3_Dosimetria_Personal_NORM.csv',
                              ['Trabajador', 'Actividad Desarrollada', 'Tiempo (h)', 'Lectura Dosímetro (µSv)'],
                              anexo3Rows.map(r => [r.worker, r.activity, r.hours, r.dose])
                            )
                          }
                          className="inline-flex items-center gap-1 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg"
                        >
                          <LucideIcon name="download" className="w-3.5 h-3.5" /> Exportar CSV
                        </button>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-100 text-slate-700 border-b border-slate-200">
                            <th className="p-2.5 font-bold">Nombre Trabajador / Rol</th>
                            <th className="p-2.5 font-bold">Actividad Desarrollada</th>
                            <th className="p-2.5 font-bold w-28">Tiempo (h)</th>
                            <th className="p-2.5 font-bold w-36">Lectura Dosímetro (µSv)</th>
                            <th className="p-2.5 w-10"></th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {anexo3Rows.map((row, idx) => (
                            <tr key={row.id}>
                              <td className="p-2">
                                <input
                                  type="text"
                                  value={row.worker}
                                  onChange={e => {
                                    const copy = [...anexo3Rows];
                                    copy[idx].worker = e.target.value;
                                    setAnexo3Rows(copy);
                                  }}
                                  className="w-full px-2 py-1 border border-slate-300 rounded"
                                />
                              </td>
                              <td className="p-2">
                                <input
                                  type="text"
                                  value={row.activity}
                                  onChange={e => {
                                    const copy = [...anexo3Rows];
                                    copy[idx].activity = e.target.value;
                                    setAnexo3Rows(copy);
                                  }}
                                  className="w-full px-2 py-1 border border-slate-300 rounded"
                                />
                              </td>
                              <td className="p-2">
                                <input
                                  type="number"
                                  step="0.5"
                                  value={row.hours}
                                  onChange={e => {
                                    const copy = [...anexo3Rows];
                                    copy[idx].hours = parseFloat(e.target.value) || 0;
                                    setAnexo3Rows(copy);
                                  }}
                                  className="w-full px-2 py-1 font-mono border border-slate-300 rounded"
                                />
                              </td>
                              <td className="p-2">
                                <input
                                  type="number"
                                  step="0.1"
                                  value={row.dose}
                                  onChange={e => {
                                    const copy = [...anexo3Rows];
                                    copy[idx].dose = parseFloat(e.target.value) || 0;
                                    setAnexo3Rows(copy);
                                  }}
                                  className="w-full px-2 py-1 font-mono font-bold text-sky-800 border border-slate-300 rounded"
                                />
                              </td>
                              <td className="p-2 text-center">
                                <button
                                  onClick={() => setAnexo3Rows(anexo3Rows.filter(r => r.id !== row.id))}
                                  className="text-slate-400 hover:text-red-600"
                                  title="Eliminar fila"
                                >
                                  <LucideIcon name="trash-2" className="w-4 h-4" />
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODAL DESLIZANTE: GLOSARIO TÉCNICO REGULATORIO */}
          {glossaryOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex justify-end">
              <div className="w-full max-w-md bg-white h-full shadow-2xl flex flex-col">
                <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <LucideIcon name="book-open" className="w-5 h-5 text-amber-400" />
                    <h2 className="text-sm font-bold">Glosario Técnico NORM & Radioprotección</h2>
                  </div>
                  <button
                    onClick={() => setGlossaryOpen(false)}
                    className="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200"
                  >
                    Cerrar
                  </button>
                </div>
                <div className="p-3 border-b border-slate-200 bg-slate-50">
                  <div className="relative">
                    <span className="absolute left-3 top-2.5 text-slate-400">
                      <LucideIcon name="search" className="w-4 h-4" />
                    </span>
                    <input
                      type="text"
                      placeholder="Buscar término (ej. Radiobarita, ALARA, Dispensa)..."
                      value={glossarySearch}
                      onChange={e => setGlossarySearch(e.target.value)}
                      className="w-full pl-9 pr-3 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-sky-500"
                    />
                  </div>
                </div>
                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {filteredGlossary.map((item, idx) => (
                    <div key={idx} className="p-3 rounded-xl border border-slate-200 bg-slate-50/70">
                      <div className="text-xs font-bold text-sky-900 mb-1">{item.term}</div>
                      <p className="text-xs text-slate-600 leading-relaxed">{item.def}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* FOOTER REGULATORIO */}
          <footer className="bg-white border-t border-slate-200 py-4 mt-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-slate-500">
              <div>
                Basado en Criterios de Vigilancia Radiológica (MME), Res. 18 1434 / 18 0005, OIEA GSR Part 3, SSG-60, Safety Report No. 34 e IOGP Report 412.
              </div>
              <div className="font-medium text-slate-700">
                Sector Hidrocarburos • Enfoque Graduado ALARA
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
